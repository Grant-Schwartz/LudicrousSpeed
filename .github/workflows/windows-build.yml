name: Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Excel add-in and Outlook guard
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build release package
        shell: pwsh
        run: ./scripts/build_windows.ps1 -Configuration Release

      - name: Set short SHA
        id: vars
        shell: pwsh
        run: |
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          "short_sha=$shortSha" >> $env:GITHUB_OUTPUT

      - name: Package beta bundle
        shell: pwsh
        run: ./scripts/package_release.ps1 -Version ${{ steps.vars.outputs.short_sha }}

      - name: Smoke test installer script
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Push-Location "dist/ludicrous-windows-${{ steps.vars.outputs.short_sha }}"
          try {
            # Invoke the way Install.cmd does -- as a scriptblock built from the
            # file's text, with -BundleDir passed explicitly -- rather than
            # running the .ps1 as a file. The wrappers stopped loading it as a
            # file so it survives a policy-enforced AllSigned execution policy,
            # and testing the file path would exercise a route no user takes.
            $installer = [scriptblock]::Create((Get-Content -Raw -LiteralPath "./Install-LudicrousSpeed.ps1"))
            & $installer -BundleDir (Get-Location).Path

            # Assert on what landed in the install directory, not just that the
            # script exited 0. The first release with this installer copied only
            # the .xll and the engine, leaving Newtonsoft.Json behind, and every
            # step here still passed -- the failure only appeared when Excel
            # tried to load the add-in, which CI never does.
            $installed = Join-Path $env:LOCALAPPDATA "LudicrousSpeed"
            foreach ($required in "LudicrousSpeed.xll", "ludicrous_engine.dll", "Newtonsoft.Json.dll") {
              if (-not (Test-Path (Join-Path $installed $required))) {
                throw "$required is missing from $installed after install. Excel would fail to load the add-in."
              }
            }

            & $installer -BundleDir (Get-Location).Path -Uninstall
            if (Test-Path $installed) { throw "Uninstall left $installed behind." }

            foreach ($cmd in "Install.cmd", "Uninstall.cmd") {
              if (-not (Test-Path $cmd)) { throw "$cmd missing from packaged bundle." }
              if (-not (Select-String -Path $cmd -Pattern "Install-LudicrousSpeed\.ps1" -Quiet)) {
                throw "$cmd does not reference Install-LudicrousSpeed.ps1."
              }
            }
            # Not executed here: they end in `pause`, which would hang a
            # non-interactive CI run. The .ps1 calls above already cover the
            # actual install/uninstall logic these wrappers just forward to.
          } finally {
            Pop-Location
          }

      - name: Smoke test Outlook guard installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Push-Location "dist/ludicrous-windows-${{ steps.vars.outputs.short_sha }}"
          try {
            $installer = [scriptblock]::Create((Get-Content -Raw -LiteralPath "./Install-OutlookGuard.ps1"))
            & $installer -BundleDir (Get-Location).Path

            # This installer hand-writes the COM registration that regasm would
            # normally produce, so checking the exit code proves nothing -- a
            # wrong or missing value here means Outlook silently never loads the
            # add-in, with no error anywhere for the user to find.
            $clsid = "{996BCB68-6439-44E2-84F0-9DF0FC563205}"
            $inproc = "HKCU:\Software\Classes\CLSID\$clsid\InprocServer32"
            if (-not (Test-Path $inproc)) { throw "COM registration missing at $inproc." }

            $server = Get-ItemProperty -Path $inproc
            if ($server."(default)" -notlike "*mscoree.dll") {
              throw "InprocServer32 default should be the CLR shim, found '$($server."(default)")'."
            }
            if ($server.Class -ne "LudicrousSpeed.OutlookAddIn.LudicrousSpeedOutlookAddIn") {
              throw "InprocServer32 Class is '$($server.Class)'."
            }
            $codeBase = ([Uri]$server.CodeBase).LocalPath
            if (-not (Test-Path $codeBase)) { throw "CodeBase points at a missing file: $codeBase." }

            $addinKey = "HKCU:\Software\Microsoft\Office\Outlook\Addins\LudicrousSpeed.OutlookAddIn"
            if ((Get-ItemProperty -Path $addinKey).LoadBehavior -ne 3) {
              throw "LoadBehavior must be 3 for Outlook to connect the add-in at startup."
            }

            & $installer -BundleDir (Get-Location).Path -Uninstall
            foreach ($leftover in $inproc, $addinKey,
                     "HKCU:\Software\Classes\LudicrousSpeed.OutlookAddIn",
                     (Join-Path $env:LOCALAPPDATA "LudicrousSpeedOutlook")) {
              if (Test-Path $leftover) { throw "Uninstall left $leftover behind." }
            }
          } finally {
            Pop-Location
          }

      - name: Upload Windows add-in artifact
        uses: actions/upload-artifact@v4
        with:
          name: ludicrous-windows-release
          path: |
            excel-addin/LudicrousSpeed.ExcelAddIn/bin/Release/net48/**
            outlook-addin/LudicrousSpeed.OutlookAddIn/bin/Release/net48/LudicrousSpeed.OutlookAddIn.dll
            target/release/ludicrous-cli.exe
            target/release/ludicrous_engine.dll
          if-no-files-found: error

      - name: Upload beta bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ludicrous-beta-bundle
          path: dist/ludicrous-windows-${{ steps.vars.outputs.short_sha }}.zip
          if-no-files-found: error

      - name: Create GitHub release for this commit
        # Manual dispatch counts too. Without this a "Run workflow" click
        # builds and packages cleanly and then silently publishes nothing,
        # which looks like a build failure and isn't one.
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: auto-${{ github.sha }}
          RELEASE_TITLE: LudicrousSpeed Windows ${{ github.sha }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $shortSha = "${{ steps.vars.outputs.short_sha }}"
          gh release create $env:RELEASE_TAG "dist/ludicrous-windows-$shortSha.zip" `
            --title "LudicrousSpeed Windows $shortSha" `
            --notes "Automatic temporary release for commit ${{ github.sha }}." `
            --target "${{ github.sha }}" `
            --latest
