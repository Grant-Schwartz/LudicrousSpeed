name: Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Excel add-in
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build release package
        shell: pwsh
        run: ./scripts/build_windows.ps1 -Configuration Release

      - name: Upload Windows add-in artifact
        uses: actions/upload-artifact@v4
        with:
          name: warpspeed-windows-release
          path: |
            excel-addin/WarpSpeed.ExcelAddIn/bin/Release/net48/**
            target/release/warpspeed-cli.exe
            target/release/warpspeed_engine.dll
          if-no-files-found: error

      - name: Package Windows release zip
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          $dist = "dist"
          $staging = Join-Path $dist "warpspeed-windows-$shortSha"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item "excel-addin/WarpSpeed.ExcelAddIn/bin/Release/net48/*" $staging -Recurse -Force
          Copy-Item "target/release/warpspeed-cli.exe" $staging -Force
          Copy-Item "target/release/warpspeed_engine.dll" $staging -Force
          Compress-Archive -Path (Join-Path $staging "*") -DestinationPath (Join-Path $dist "warpspeed-windows-$shortSha.zip") -Force

      - name: Create GitHub release for this commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: auto-${{ github.sha }}
          RELEASE_TITLE: WarpSpeed Windows ${{ github.sha }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          gh release create $env:RELEASE_TAG "dist/warpspeed-windows-$shortSha.zip" `
            --title "WarpSpeed Windows $shortSha" `
            --notes "Automatic temporary release for commit ${{ github.sha }}." `
            --target "${{ github.sha }}" `
            --latest
