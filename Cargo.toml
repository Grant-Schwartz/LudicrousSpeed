[workspace]
members = ["crates/warpspeed-engine"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://example.local/warpspeed"

[patch.crates-io]
# Fixes an upstream import-perf bug (per-formula-cell parser reconstruction
# that deep-clones the workbook's defined-name list); see
# vendor/ironcalc-0.7.1-patched/README.md. Not yet reported upstream.
ironcalc = { path = "vendor/ironcalc-0.7.1-patched" }

